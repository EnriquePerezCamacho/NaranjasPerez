name: Publicar web

# Publica en GitHub Pages:
#   /      → página de presentación (carpeta web/)
#   /app/  → la misma app del móvil, para usarla en el ordenador (carpeta www/)
on:
  push:
    branches: [main]
    paths: ['web/**', 'www/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar la web
        run: |
          mkdir -p _site/app
          cp -r web/. _site/
          cp -r www/. _site/app/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
