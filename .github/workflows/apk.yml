name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Permisos de cámara y GPS
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n\n    <application#' $M
          cat $M

      - name: Icono de la app
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Icono de los avisos
        run: cp -r assets/notif/* android/app/src/main/res/

      - name: Copiar la web al proyecto
        run: npx cap sync android

      - name: Firma fija (permite actualizar encima sin perder datos)
        env:
          KS: ${{ secrets.LL_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/ll.keystore"; else cp firma/las-largas.keystore "$RUNNER_TEMP/ll.keystore"; fi
          keytool -list -keystore "$RUNNER_TEMP/ll.keystore" -storepass android | grep -i fingerprint
          cat >> android/app/build.gradle <<EOF2

          android {
              signingConfigs {
                  fija {
                      storeFile file("$RUNNER_TEMP/ll.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fija }
              }
          }
          EOF2
          tail -16 android/app/build.gradle

      - name: Número de versión
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.3.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar y comprobar la firma
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk las-largas.apk
          cp las-largas.apk campcontrol.apk
          A=$(keytool -printcert -jarfile las-largas.apk | grep -m1 SHA256 | awk '{print $2}')
          K=$(keytool -list -v -keystore "$RUNNER_TEMP/ll.keystore" -storepass android | grep -m1 SHA256 | awk '{print $2}')
          echo "APK $A"; echo "KEY $K"
          [ "$A" = "$K" ] || { echo "La APK no lleva la firma fija"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: campcontrol-apk
          path: campcontrol.apk

      - name: Publicar en Releases (enlace fijo para el móvil)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" campcontrol.apk las-largas.apk \
            --title "CampControl 1.3.${{ github.run_number }}" \
            --notes "Descarga campcontrol.apk desde el móvil e instálala encima de la anterior." \
            --latest
