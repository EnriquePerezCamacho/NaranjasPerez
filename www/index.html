<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3d2b">
<title>Las Largas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="leaflet/leaflet.css">
<script src="leaflet/leaflet.js"></script>
<style>
/* Mapa a pantalla completa, barra inferior con pestañas, botón de cámara grande para usar con una mano en el campo */
:root{
  --bg:#f3f5ef; --panel:#ffffff; --ink:#1b2a1f; --muted:#5b6a5f; --line:#d6ded2;
  --leaf:#1f3d2b; --leaf-ink:#ffffff; --orange:#ee7d00; --orange-ink:#1b1200; --danger:#c62828; --ok:#2e7d32;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121a14; --panel:#1b251e; --ink:#e7eee6; --muted:#9db0a2; --line:#2e3c32;
  --leaf:#16301f; --leaf-ink:#e7eee6; --orange:#ff9a1f; --orange-ink:#1b1200; --danger:#ef5350; --ok:#66bb6a;
  color-scheme:dark;}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

header{background:var(--leaf);color:var(--leaf-ink);display:flex;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
header h1{margin:0;font-size:1.2rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
header h1 .dot{width:14px;height:14px;border-radius:50%;background:var(--orange);box-shadow:inset -3px -3px 0 rgba(0,0,0,.18)}
#count{margin-left:auto;font-size:.85rem;opacity:.85;font-variant-numeric:tabular-nums}
.icon-btn{background:transparent;border:0;color:inherit;width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.icon-btn:active{background:rgba(255,255,255,.12)}
.icon-btn svg{width:22px;height:22px}

main{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0;z-index:0;background:#cfd8cc}
#listView{position:absolute;inset:0;z-index:1;overflow:auto;background:var(--bg);
  padding:14px max(16px,env(safe-area-inset-right,0px)) 100px max(16px,env(safe-area-inset-left,0px))}

nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.8rem}
nav button svg{width:24px;height:24px}
nav button[aria-pressed="true"]{color:var(--ink);font-weight:700}
nav button[aria-pressed="true"] svg{color:var(--orange)}

.fab{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:18px;z-index:800;width:68px;height:68px;border-radius:50%;
  border:0;background:var(--orange);color:var(--orange-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.fab svg{width:32px;height:32px}
.map-btn{position:absolute;right:max(20px,calc(env(safe-area-inset-right,0px) + 4px));z-index:800;width:52px;height:52px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.map-btn svg{width:24px;height:24px}
.map-btn[aria-pressed="true"]{color:#1c7ed6;border-color:#1c7ed6}
#btnLocate{bottom:100px}
#btnFit{bottom:162px}

/* Leaflet adjustments */
.leaflet-control-layers{font-family:var(--font);border-radius:12px!important}
.leaflet-control-layers-toggle{width:48px!important;height:48px!important}
.leaflet-control-layers-expanded{padding:10px 14px;font-size:15px;line-height:1.9}
.leaflet-popup-content-wrapper{border-radius:14px;background:var(--panel);color:var(--ink)}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:12px;font-family:var(--font);font-size:15px}
.pin{display:block;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.pin.done{background:#9aa5a0;opacity:.85}
.pin.sel{outline:3px solid var(--orange);outline-offset:2px}
.me-dot{width:18px;height:18px;border-radius:50%;background:#1c7ed6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(28,126,214,.25)}

.pop h3{margin:0 0 4px;font-size:1.05rem;text-wrap:balance}
.gal{position:relative;margin-bottom:8px}
.gal .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:10px;scrollbar-width:none;background:#000}
.gal .track::-webkit-scrollbar{display:none}
.gal .m{flex:0 0 100%;height:160px;scroll-snap-align:center;position:relative;cursor:zoom-in;border:0;padding:0;background:#000}
.gal .m img,.gal .m video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.gal .n{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:.78rem;padding:2px 9px;border-radius:999px;font-variant-numeric:tabular-nums;pointer-events:none}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px;line-height:1;display:grid;place-items:center}
.gal .prev{left:6px}.gal .next{right:6px}
.play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.play span{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:17px;padding-left:3px}
.card .thw{position:relative;width:76px;height:76px}
.card .thw .play span{width:30px;height:30px;font-size:12px}
.pop p{margin:6px 0;color:var(--muted);font-size:.92rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pop .row{display:flex;gap:6px;margin-top:10px}
.pop .row button{flex:1}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.state{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.state.pendiente{color:var(--orange)}
.state.resuelta{color:var(--ok)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;min-height:44px;font-weight:700}
.btn.primary{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.btn.accent{background:var(--orange);color:var(--orange-ink);border-color:var(--orange)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.sm{min-height:38px;padding:6px 10px;font-size:.9rem}
.btn:focus-visible,.icon-btn:focus-visible,.fab:focus-visible,.map-btn:focus-visible,.f-chip:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* Lista */
.filters{display:grid;gap:10px;margin-bottom:14px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.f-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.f-chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;display:inline-flex;align-items:center;gap:7px;font-size:.9rem}
.f-chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.f-chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.seg button{flex:1;border:0;background:none;padding:9px 0;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-ink);font-weight:700}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.cards{display:grid;gap:10px}
.card{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;width:100%}
.card .th{width:76px;height:76px;border-radius:10px;object-fit:cover;background:var(--c);display:grid;place-items:center;color:#fff}
.card .th svg{width:28px;height:28px;opacity:.85}
.card .body{min-width:0;display:grid;gap:4px}
.card h3{margin:0;font-size:1rem;overflow-wrap:anywhere}
.card p{margin:0;color:var(--muted);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty strong{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:6px}

/* Formulario */
.sheet{position:fixed;inset:0;z-index:1500;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--panel);width:100%;max-width:560px;max-height:94dvh;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.sheet h2{margin:0;font-size:1.2rem}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.field textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.photos .ph{position:relative;flex:none}
.photos img,.photos video{width:96px;height:96px;object-fit:cover;border-radius:10px;display:block;background:#000}
.photos .ph{cursor:zoom-in}
.photos .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:16px;line-height:1}
.add-ph{flex:none;width:96px;height:96px;border:2px dashed var(--line);border-radius:10px;background:none;display:grid;place-items:center;align-content:center;gap:4px;color:var(--muted);font-size:.78rem}
.add-ph svg{width:26px;height:26px}
.loc{display:grid;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.loc .coords{font-variant-numeric:tabular-nums;font-size:.95rem}
.loc .coords.none{color:var(--danger)}
.loc .row{display:flex;gap:8px;flex-wrap:wrap}
.loc .row .btn{flex:1}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}

.banner{position:fixed;left:0;right:0;top:0;z-index:1400;background:var(--orange);color:var(--orange-ink);font-weight:700;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.banner span{flex:1}
.menu{position:fixed;z-index:1600;top:calc(56px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:grid;min-width:230px;overflow:hidden}
.menu button{background:none;border:0;text-align:left;padding:14px 16px;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.viewer{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.94);display:grid;place-items:center;
  padding:calc(56px + env(safe-area-inset-top,0px)) 12px calc(56px + env(safe-area-inset-bottom,0px))}
.viewer #viewerStage{width:100%;height:100%;display:grid;place-items:center;min-height:0}
.viewer img,.viewer video{max-width:100%;max-height:100%;border-radius:8px;display:block}
.vbtn{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;width:48px;height:48px;border-radius:50%;font-size:24px;line-height:1;display:grid;place-items:center}
.vclose{top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
.vprev{left:max(8px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%)}
.vnext{right:max(8px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}
.vcount{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));color:#fff;font-size:.95rem;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2100;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>Las Largas</h1>
  <span id="count"></span>
  <button class="icon-btn" id="btnMenu" aria-label="Más opciones">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
  </button>
</header>

<main>
  <div id="map"></div>
  <section id="listView" hidden>
    <div class="filters">
      <input id="q" class="search" type="search" placeholder="Buscar por título o descripción" autocomplete="off">
      <div class="f-row" id="tipoChips"></div>
      <div class="seg" id="estadoSeg">
        <button data-v="todas" aria-pressed="true">Todas</button>
        <button data-v="pendiente" aria-pressed="false">Pendientes</button>
        <button data-v="resuelta" aria-pressed="false">Resueltas</button>
      </div>
      <p class="hint">El filtro también se aplica a los puntos del mapa.</p>
    </div>
    <div class="cards" id="cards"></div>
  </section>
  <button class="map-btn" id="btnFit" aria-label="Ver todas las incidencias" title="Ver todas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button class="map-btn" id="btnLocate" aria-label="Seguir mi posición" aria-pressed="false" title="Mi posición">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
  <button class="fab" id="btnNew" aria-label="Nueva incidencia con foto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
  </button>
</main>

<nav>
  <button id="tabMap" aria-pressed="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Mapa
  </button>
  <button id="tabList" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Lista
  </button>
</nav>

<!-- Formulario de incidencia -->
<div class="sheet" id="sheet" hidden>
  <form class="panel" id="form" novalidate>
    <h2 id="formTitle">Nueva incidencia</h2>
    <div class="field">
      <span class="lbl">Fotos y vídeos</span>
      <div class="photos" id="photos"></div>
    </div>
    <div class="field">
      <label for="fTitulo">Título</label>
      <input id="fTitulo" maxlength="80" placeholder="Ej.: Fila 7 – naranjo con minador">
    </div>
    <div class="two">
      <div class="field"><label for="fTipo">Tipo</label><select id="fTipo"></select></div>
      <div class="field"><label for="fEstado">Estado</label>
        <select id="fEstado"><option value="pendiente">Pendiente</option><option value="resuelta">Resuelta</option></select></div>
    </div>
    <div class="field"><label for="fFecha">Fecha</label><input id="fFecha" type="date"></div>
    <div class="field"><label for="fDesc">Qué le ocurre</label>
      <textarea id="fDesc" placeholder="Síntomas, tratamiento aplicado, qué hay que hacer…"></textarea></div>
    <div class="field">
      <span class="lbl">Ubicación del árbol</span>
      <div class="loc">
        <div class="coords" id="fCoords">Buscando GPS…</div>
        <div class="row">
          <button type="button" class="btn sm" id="btnGps">Usar mi GPS</button>
          <button type="button" class="btn sm" id="btnPick">Elegir en el mapa</button>
        </div>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn danger" id="btnDelete" hidden>Borrar</button>
      <button type="button" class="btn" id="btnCancel">Cancelar</button>
      <button type="submit" class="btn primary">Guardar</button>
    </div>
  </form>
</div>

<input type="file" id="inCam" accept="image/*" capture="environment" hidden>
<input type="file" id="inVid" accept="video/*" capture="environment" hidden>
<input type="file" id="inGal" accept="image/*,video/*" multiple hidden>
<input type="file" id="inImport" hidden>

<div class="banner" id="pickBanner" hidden><span>Toca en el mapa donde está el naranjo</span><button class="btn sm" id="pickCancel">Cancelar</button></div>
<div class="menu" id="menu" hidden>
  <button id="mExport">Exportar copia de seguridad</button>
  <button id="mImport">Importar copia de seguridad</button>
  <button id="mFit">Ver todas en el mapa</button>
</div>
<div class="viewer" id="viewer" hidden><div id="viewerStage"></div>
  <button class="vbtn vclose" id="vClose" aria-label="Cerrar">✕</button>
  <button class="vbtn vprev" id="vPrev" aria-label="Anterior">‹</button>
  <button class="vbtn vnext" id="vNext" aria-label="Siguiente">›</button>
  <span class="vcount" id="vCount"></span></div>
<div class="sheet" id="copiaOk" hidden>
  <div class="panel">
    <h2>Copia de seguridad guardada</h2>
    <p id="copiaTxt" style="margin:0"></p>
    <div class="actions"><button type="button" class="btn" id="copiaClose">Cerrar</button><button type="button" class="btn primary" id="copiaShare">Compartir copia</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const TIPOS = {
  plaga:{n:'Plaga',c:'#e8590c'},
  enfermedad:{n:'Enfermedad',c:'#c2255c'},
  riego:{n:'Riego / goteo',c:'#1c7ed6'},
  poda:{n:'Poda',c:'#2f9e44'},
  abonado:{n:'Abonado / carencia',c:'#a07400'},
  rotura:{n:'Rotura / daño',c:'#7048e8'},
  replantar:{n:'Marra / replantar',c:'#0c8599'},
  otro:{n:'Otro',c:'#495057'}
};
const ICON_CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const ICON_VID = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg>';
const ICON_GAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>';

/* ---------- Almacenamiento (IndexedDB, en el propio móvil) ---------- */
const DB = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('mi-naranjal', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('inc', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('inc', mode); const req = fn(t.objectStore('inc'));
      t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error);
    });
  };
  return { all: () => tx('readonly', s => s.getAll()), put: o => tx('readwrite', s => s.put(o)), del: id => tx('readwrite', s => s.delete(id)) };
})();

const urlFor = (() => { const m = new WeakMap(); return b => { let u = m.get(b); if (!u) { u = URL.createObjectURL(b); m.set(b, u); } return u; }; })();
const isVid = b => (b?.type || '').startsWith('video/');
const mediaHtml = (b, cls = '') => isVid(b)
  ? `<video class="${cls}" src="${urlFor(b)}#t=0.1" preload="metadata" muted playsinline></video><span class="play"><span>▶</span></span>`
  : `<img class="${cls}" src="${urlFor(b)}" alt="">`;
const cuenta = arr => { const v = arr.filter(isVid).length, f = arr.length - v;
  return [f ? `${f} foto${f > 1 ? 's' : ''}` : '', v ? `${v} vídeo${v > 1 ? 's' : ''}` : ''].filter(Boolean).join(' · '); };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDate = s => s ? new Date(s + 'T12:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

async function compress(file, max = 1600, q = 0.8) {
  let img = null;
  try { img = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) {}
  if (!img) img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', q));
}

/* ---------- Mapa y capas ---------- */

};

/* ---------- Estado y filtros ---------- */
let items = [];
const filt = { q: '', tipos: new Set(), estado: 'todas' };
const visibles = () => {
  const q = filt.q.trim().toLowerCase();
  return items.filter(it =>
    (!q || ((it.titulo || '') + ' ' + (it.desc || '')).toLowerCase().includes(q)) &&
    (!filt.tipos.size || filt.tipos.has(it.tipo)) &&
    (filt.estado === 'todas' || it.estado === filt.estado));
};
const pinIcon = it => L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [4, 30], popupAnchor: [11, -28],
  html: `<span class="pin ${it.estado === 'resuelta' ? 'done' : ''}" style="--c:${(TIPOS[it.tipo] || TIPOS.otro).c}"></span>` });

function popupEl(it) {
  const t = TIPOS[it.tipo] || TIPOS.otro;
  const el = document.createElement('div'); el.className = 'pop';
  const media = it.fotos || [];
  el.innerHTML = `${media.length ? `<div class="gal"><div class="track">${media.map((b, i) => `<button class="m" data-i="${i}" aria-label="Ver ${isVid(b) ? 'vídeo' : 'foto'} ${i + 1}">${mediaHtml(b)}</button>`).join('')}</div>
      ${media.length > 1 ? `<button class="nav prev" aria-label="Anterior">‹</button><button class="nav next" aria-label="Siguiente">›</button><span class="n">1 / ${media.length}</span>` : ''}</div>` : ''}
    <h3>${esc(it.titulo)}</h3>
    <div class="meta"><span class="chip" style="--c:${t.c}"><i></i>${t.n}</span><span>${fmtDate(it.fecha)}</span>
    <span class="state ${it.estado}">${it.estado}</span></div>
    ${it.desc ? `<p>${esc(it.desc)}</p>` : ''}
    <div class="row"><button class="btn sm" data-a="edit">Editar</button>
    <button class="btn sm" data-a="toggle">${it.estado === 'resuelta' ? 'Reabrir' : 'Resuelta'}</button>
    <button class="btn sm danger" data-a="del">Borrar</button></div>`;
  const track = el.querySelector('.track');
  if (track) {
    const idx = () => Math.round(track.scrollLeft / track.clientWidth);
    const flechas = () => { const i = idx(), pv = el.querySelector('.prev'), nx = el.querySelector('.next'), n = el.querySelector('.n');
      if (n) n.textContent = `${i + 1} / ${media.length}`; if (pv) pv.hidden = i === 0; if (nx) nx.hidden = i === media.length - 1; };
    track.addEventListener('scroll', flechas, { passive: true }); setTimeout(flechas, 0);
    el.querySelector('.prev')?.addEventListener('click', ev => { ev.stopPropagation(); track.scrollTo({ left: Math.max(0, idx() - 1) * track.clientWidth, behavior: 'smooth' }); });
    el.querySelector('.next')?.addEventListener('click', ev => { ev.stopPropagation(); track.scrollTo({ left: Math.min(media.length - 1, idx() + 1) * track.clientWidth, behavior: 'smooth' }); });
    track.querySelectorAll('.m').forEach(m => m.addEventListener('click', () => verMedia(media, +m.dataset.i)));
  }
  el.addEventListener('click', async e => {
    const a = e.target.dataset.a; if (!a) return;
    if (a === 'edit') { map.closePopup(); abrirForm(it); }
    if (a === 'toggle') { it.estado = it.estado === 'resuelta' ? 'pendiente' : 'resuelta'; await DB.put(it); render(); toast(it.estado === 'resuelta' ? 'Marcada como resuelta' : 'Reabierta'); }
    if (a === 'del') borrar(it);

  return el;
}

function render() {
  const v = visibles();
  markers.clearLayers();
  v.forEach(it => {
    const m = L.marker([it.lat, it.lng], { icon: pinIcon(it) }).bindPopup(() => popupEl(it), { maxWidth: 270, minWidth: 230 });
    m.itemId = it.id; markers.addLayer(m);

  $('#count').textContent = v.length === items.length ? `${items.length} incidencias` : `${v.length} de ${items.length}`;

function renderList(v) {
  const box = $('#cards');
  if (!items.length) { box.innerHTML = '<div class="empty"><strong>Aún no hay incidencias</strong>Pulsa el botón naranja de la cámara junto a un naranjo para registrar la primera.</div>'; return; }
  if (!v.length) { box.innerHTML = '<div class="empty"><strong>Nada coincide con el filtro</strong>Prueba con otra búsqueda o quita algún tipo.</div>'; return; }
  box.innerHTML = '';
  [...v].sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '') || b.creado - a.creado).forEach(it => {
    const t = TIPOS[it.tipo] || TIPOS.otro;

    b.innerHTML = `${it.fotos?.[0] ? `<span class="thw">${mediaHtml(it.fotos[0], 'th')}</span>` : `<span class="th">${ICON_CAM}</span>`}

function buildFilters() {

/* ---------- Seguir mi posición ---------- */
let watchId = null, meMarker = null, meCircle = null, firstFix = false;
$('#btnLocate').onclick = () => {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; meMarker?.remove(); meCircle?.remove(); meMarker = meCircle = null; $('#btnLocate').setAttribute('aria-pressed', 'false'); return; }
  if (!navigator.geolocation) return toast('Este dispositivo no tiene GPS disponible');
  firstFix = true; $('#btnLocate').setAttribute('aria-pressed', 'true');
  watchId = navigator.geolocation.watchPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (!meMarker) { meMarker = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18] }), interactive: false }).addTo(map);
      meCircle = L.circle(ll, { radius: p.coords.accuracy, color: '#1c7ed6', weight: 1, fillOpacity: .1, interactive: false }).addTo(map); }
    else { meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(p.coords.accuracy); }
    if (firstFix) { map.setView(ll, Math.max(map.getZoom(), 18)); firstFix = false; }
  }, err => { toast(errGps(err)); $('#btnLocate').click(); }, { enableHighAccuracy: true, maximumAge: 2000 });
};
const errGps = e => e.code === 1 ? 'Permite el acceso a la ubicación en los ajustes del navegador' : 'No se pudo obtener la posición GPS';

/* ---------- Formulario ---------- */
let ed = null;
function abrirForm(it) {
  ed = it ? { ...it, fotos: [...(it.fotos || [])], nuevo: false }
          : { id: uid(), titulo: '', tipo: 'plaga', estado: 'pendiente', fecha: today(), desc: '', fotos: [], lat: null, lng: null, acc: null, nuevo: true };
  $('#formTitle').textContent = ed.nuevo ? 'Nueva incidencia' : 'Editar incidencia';
  $('#fTitulo').value = ed.titulo; $('#fTipo').value = ed.tipo; $('#fEstado').value = ed.estado; $('#fFecha').value = ed.fecha; $('#fDesc').value = ed.desc;
  $('#btnDelete').hidden = ed.nuevo;
  pintarFotos(); pintarCoords(); $('#sheet').hidden = false;
  if (ed.nuevo) tomarGps();
}
function cerrarForm() { $('#sheet').hidden = true; ed = null; }
function pintarFotos() {
  const box = $('#photos'); box.innerHTML = '';
  ed.fotos.forEach((b, i) => {
    const d = document.createElement('div'); d.className = 'ph';
    d.innerHTML = `${mediaHtml(b)}<button type="button" class="x" aria-label="Quitar">✕</button>`;
    d.onclick = () => verMedia(ed.fotos, i);

    box.appendChild(d);
  });
  box.insertAdjacentHTML('beforeend', `<button type="button" class="add-ph" id="addCam">${ICON_CAM}Foto</button><button type="button" class="add-ph" id="addVid">${ICON_VID}Vídeo</button><button type="button" class="add-ph" id="addGal">${ICON_GAL}Galería</button>`);
  $('#addVid').onclick = () => $('#inVid').click();
  $('#addCam').onclick = () => $('#inCam').click();
  $('#addGal').onclick = () => $('#inGal').click();
}
function pintarCoords() {
  const el = $('#fCoords');
  if (ed.lat == null) { el.textContent = 'Sin ubicación todavía'; el.classList.add('none'); return; }
  el.classList.remove('none');
  el.textContent = `${ed.lat.toFixed(6)}, ${ed.lng.toFixed(6)}${ed.acc ? `  ·  precisión ±${Math.round(ed.acc)} m` : '  ·  elegida en el mapa'}`;
}
function tomarGps() {
  if (!navigator.geolocation) { $('#fCoords').textContent = 'GPS no disponible: elige en el mapa'; return; }
  $('#fCoords').textContent = 'Buscando GPS…'; $('#fCoords').classList.remove('none');
  const target = ed; let best = null, n = 0;
  const id = navigator.geolocation.watchPosition(p => {
    if (ed !== target) return navigator.geolocation.clearWatch(id);
    n++;
    if (!best || p.coords.accuracy < best.accuracy) { best = p.coords; ed.lat = best.latitude; ed.lng = best.longitude; ed.acc = best.accuracy; pintarCoords(); }
    if (best.accuracy <= 6 || n >= 8) navigator.geolocation.clearWatch(id);
  }, err => { if (ed === target) { $('#fCoords').textContent = errGps(err); $('#fCoords').classList.add('none'); } navigator.geolocation.clearWatch(id); },
  { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  setTimeout(() => navigator.geolocation.clearWatch(id), 20000);
}
async function anadirFotos(files) {
  if (!ed) return;
  for (const f of files) {
    if (isVid(f)) {
      if (f.size > 200 * 1024 * 1024) { toast('Vídeo demasiado grande (máx. 200 MB). Graba uno más corto.'); continue; }
      ed.fotos.push(f); if (f.size > 60 * 1024 * 1024) toast(`Vídeo de ${Math.round(f.size / 1048576)} MB: ocupa bastante espacio`);
      continue;
    }
    try { ed.fotos.push(await compress(f)); } catch (e) { toast('No se pudo leer una de las fotos'); }
  }
  pintarFotos();
}
$('#inCam').onchange = e => { anadirFotos([...e.target.files]); e.target.value = ''; };
$('#inVid').onchange = e => { anadirFotos([...e.target.files]); e.target.value = ''; };
$('#inGal').onchange = e => { anadirFotos([...e.target.files]); e.target.value = ''; };
$('#btnGps').onclick = tomarGps;
$('#btnCancel').onclick = cerrarForm;
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') cerrarForm(); });

$('#btnNew').onclick = () => { vista('mapa'); abrirForm(null); $('#inCam').click(); };

$('#form').addEventListener('submit', async e => {
  e.preventDefault();

let vList = [], vIdx = 0;
function verMedia(list, i) { vList = list; vIdx = i; pintarVisor(); $('#viewer').hidden = false; }
function pintarVisor() {

$('#viewer').addEventListener('touchend', e => { if (tx0 == null) return; const dx = e.changedTouches[0].clientX - tx0; tx0 = null; if (Math.abs(dx) > 50) moverVisor(dx < 0 ? 1 : -1); });

$('#btnMenu').onclick = e => { e.stopPropagation(); $('#menu').hidden = !$('#menu').hidden; };

/* Copia de seguridad por trozos: una línea JSON por incidencia y cada foto o vídeo
   partido en trozos de ~750 KB. Así nunca se carga en memoria un texto gigante. */
const TROZO = 3 * 196608; // bytes por trozo (múltiplo de 3 para que el base64 se pueda unir)
const blobB64 = b => new Promise((res, rej) => { const f = new FileReader();
  f.onload = () => res(String(f.result).slice(String(f.result).indexOf(',') + 1)); f.onerror = () => rej(f.error); f.readAsDataURL(b); });
const b64Bytes = s => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
const nativo = () => window.Capacitor?.isNativePlatform?.() && window.Capacitor.Plugins?.Filesystem ? window.Capacitor.Plugins : null;
const fmtMB = n => n > 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`;

async function escritor(nombre) {
  const P = nativo();
  if (!P) { const partes = []; return { add: async t => { partes.push(t); }, fin: async () => ({ blob: new Blob(partes, { type: 'application/x-ndjson' }) }) }; }
  let dir = 'DOCUMENTS', ruta = `LasLargas/${nombre}`, empezado = false;
  try { await P.Filesystem.requestPermissions?.(); } catch (e) {}
  const escribir = async (t) => {
    if (!empezado) { await P.Filesystem.writeFile({ path: ruta, data: t, directory: dir, encoding: 'utf8', recursive: true }); empezado = true; }
    else await P.Filesystem.appendFile({ path: ruta, data: t, directory: dir, encoding: 'utf8' });
  };
  let buf = '';
  return {
    add: async t => {
      buf += t; if (buf.length < 512 * 1024) return;
      const t2 = buf; buf = '';
      try { await escribir(t2); }
      catch (err) { if (empezado || dir === 'CACHE') throw err; dir = 'CACHE'; ruta = nombre; await escribir(t2); }
    },
    fin: async () => {
      if (buf) { try { await escribir(buf); } catch (err) { if (empezado || dir === 'CACHE') throw err; dir = 'CACHE'; ruta = nombre; await escribir(buf); } buf = ''; }
      const u = await P.Filesystem.getUri({ path: ruta, directory: dir });
      return { uri: u.uri, dir, ruta };
    }
  };
}

let exportando = false;
$('#mExport').onclick = async () => {
  if (exportando) return; exportando = true; $('#menu').hidden = true;
  const nombre = `las-largas-${today()}-${new Date().toTimeString().slice(0, 5).replace(':', '')}.json`;
  try {
    const w = await escritor(nombre);
    let total = 0;
    await w.add(JSON.stringify({ t: 'meta', app: 'las-largas', version: 2, exportado: new Date().toISOString(), n: items.length }) + '\n');
    for (let k = 0; k < items.length; k++) {
      const it = items[k]; const fotos = it.fotos || [];
      toast(`Guardando copia… ${k + 1} de ${items.length}`);
      const { fotos: _f, ...datos } = it;
      await w.add(JSON.stringify({ t: 'item', item: datos, media: fotos.map(b => ({ type: b.type || 'image/jpeg', size: b.size })) }) + '\n');
      for (let i = 0; i < fotos.length; i++) {
        const b = fotos[i]; total += b.size;
        for (let o = 0; o < b.size; o += TROZO)
          await w.add(JSON.stringify({ t: 'part', id: it.id, i, d: await blobB64(b.slice(o, o + TROZO)) }) + '\n');
      }
    }
    await w.add(JSON.stringify({ t: 'fin' }) + '\n');
    const r = await w.fin();
    if (r.blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(r.blob); a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); toast('Copia descargada'); }
    else avisoCopia(r, nombre, items.length, total);
  } catch (err) {
    toast('No se pudo guardar la copia: ' + (err?.message || 'error desconocido'));
  } finally { exportando = false; }
};

function avisoCopia(r, nombre, n, total) {
  const box = $('#copiaOk');
  $('#copiaTxt').innerHTML = r.dir === 'DOCUMENTS'
    ? `Guardada en <b>Documentos › LasLargas</b> del móvil.<br><span class="hint">${esc(nombre)} · ${n} incidencias · ${fmtMB(total)} de fotos y vídeos</span>`
    : `Copia lista (${n} incidencias). Compártela para guardarla en Drive, WhatsApp o el correo.`;
  box.hidden = false;
  $('#copiaShare').onclick = async () => {
    try { await window.Capacitor.Plugins.Share.share({ title: 'Copia de Las Largas', files: [r.uri] }); }
    catch (err) { if (!/cancel/i.test(String(err?.message))) toast('No se pudo abrir compartir'); }
  };
}
$('#copiaClose').onclick = () => $('#copiaOk').hidden = true;

$('#mImport').onclick = () => { $('#menu').hidden = true; $('#inImport').click(); };
$('#inImport').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const cab = await f.slice(0, 64).text();
    const n = cab.includes('"t":"meta"') ? await importarV2(f) : await importarV1(f);
    items = await DB.all(); render(); encuadrar(); toast(`${n} incidencias importadas`);
  } catch (err) { toast('Ese archivo no es una copia válida de Las Largas'); }
};
async function importarV2(f) {
  const dec = new TextDecoder(); let resto = '', actual = null, n = 0, ok = false;
  const cerrar = async () => {
    if (!actual) return;
    actual.item.fotos = actual.media.map((m, i) => new Blob(actual.partes[i] || [], { type: m.type }));
    await DB.put(actual.item); n++; actual = null;
  };
  const linea = async l => {
    if (!l.trim()) return;
    const o = JSON.parse(l);
    if (o.t === 'meta') ok = true;
    else if (o.t === 'item') { await cerrar(); if (typeof o.item?.lat === 'number' && typeof o.item?.lng === 'number') actual = { item: o.item, media: o.media || [], partes: [] }; }
    else if (o.t === 'part' && actual && o.id === actual.item.id) (actual.partes[o.i] ||= []).push(b64Bytes(o.d));
  };
  const PASO = 4 * 1048576;
  for (let off = 0; off < f.size; off += PASO) {
    toast(`Importando… ${Math.min(100, Math.round(off / f.size * 100))} %`);
    resto += dec.decode(await f.slice(off, off + PASO).arrayBuffer(), { stream: true });
    const ls = resto.split('\n'); resto = ls.pop();
    for (const l of ls) await linea(l);
  }
  resto += dec.decode(); await linea(resto); await cerrar();
  if (!ok) throw new Error('formato');
  return n;
}
async function importarV1(f) {
  const data = JSON.parse(await f.text());
  if (!Array.isArray(data.items)) throw 0;
  let n = 0;
  for (const it of data.items) {
    if (typeof it.lat !== 'number' || typeof it.lng !== 'number') continue;
    it.fotos = await Promise.all((it.fotos || []).map(d => fetch(d).then(r => r.blob())));
    await DB.put(it); n++;
  }
  return n;
}

/* ---------- Arranque ---------- */
buildFilters();
DB.all().then(r => { items = r; render(); if (items.length) encuadrar(); }).catch(() => toast('No se pudo abrir el almacenamiento del navegador'));
if ('serviceWorker' in navigator && location.protocol !== 'file:' && !window.Capacitor?.isNativePlatform?.()) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
